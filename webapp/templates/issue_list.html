{% extends "base.html" %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h1 class="card-title">Задачи</h1>
      <ul class="list-group">
        {% for issue in issues %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'issue_detail' issue.pk %}">{{ issue.summary }}</a>
            <div>
              <a href="{% url 'issue_update' issue.pk %}" class="btn btn-sm btn-primary">Редактировать</a>
              <a href="{% url 'issue_delete' issue.pk %}" class="btn btn-sm btn-danger">Удалить</a>
            </div>
          </li>
        {% empty %}
          <li class="list-group-item">Нет задач</li>
        {% endfor %}
      </ul>
      <a href="{% url 'issue_create' %}" class="btn btn-success mt-3">Добавить задачу</a>
    </div>
  </div>
{% endblock %}
