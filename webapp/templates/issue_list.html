{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h1 class="card-title">Задачи</h1>
    <ul class="list-group">
      {% for issue in issues %}
        {% include 'issue_card.html' %}
      {% empty %}
        <li class="list-group-item">Нет задач</li>
      {% endfor %}
    </ul>
    <a href="{% url 'issue_create' %}" class="btn btn-success mt-3">Добавить задачу</a>
  </div>
</div>
{% endblock %}
