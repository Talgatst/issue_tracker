{% extends "base.html" %}

{% block content %}
<div class="card mt-3">
  <div class="card-body">
    <h1 class="card-title">Удалить задачу</h1>
    <p class="card-text">Подтверждаете удаление задачи: <strong>{{ issue.summary }}</strong>?</p>
    <form method="POST" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Удалить</button>
    </form>
    <a href="{% url 'issue_list' %}" class="btn btn-secondary mt-3">Отменить</a>
  </div>
</div>
{% endblock %}
