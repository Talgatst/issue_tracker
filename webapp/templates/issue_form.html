{% extends "base.html" %}

{% block content %}
  <h1>{% if form.instance.pk %}Редактировать задачу{% else %}Добавить задачу{% endif %}</h1>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if form.instance.pk %}Сохранить{% else %}Добавить{% endif %}</button>
  </form>
  <a href="{% url 'issue_list' %}">Отменить</a>
{% endblock %}
